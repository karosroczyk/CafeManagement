spring.application.name=apigateway
server.port=8089

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

application.security.jwt.secret-key=eHJhc2thdXNqZTl4cWF3ZXJ0eXplYXM5Z2RyYXNramY
application.security.jwt.expiration=8640000

spring.cloud.gateway.server.webflux.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://order
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webflux.routes[1].id=menu-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://menu
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/menuitems/**

spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**